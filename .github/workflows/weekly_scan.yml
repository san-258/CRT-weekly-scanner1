name: Weekly Market Scan

on:
  schedule:
    # Runs every Friday at 23:00 UTC (7:00 PM EDT)
    - cron: '0 23 * * 5'
  workflow_dispatch: # Allows you to manually click a button to run it anytime

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f Requirements ]; then pip install -r Requirements; fi

    - name: Run Scanner Script
      run: |
        # Run the script and save the full terminal output to a temporary file called scan_report.txt
        python WeeklyCRT.py > scan_report.txt

    - name: Send Email Notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "Weekly Market Scan Results - Friday"
        to: stocks.scanner0@gmail.com # Make sure your real email address is here
        from: GitHub Market Scanner
        # This will read the text file directly and cleanly drop it into the email body
        body: file://scan_report.txt
